let currentIndex = 0;
let firstTryCorrectCount = 0;
let isFirstTry = true;
let mistakes = [];

function loadQuestion() {
    if (currentIndex >= quizList.length) {
        showResult();
        return;
    }
    const current = quizList[currentIndex];
    document.getElementById('progress').textContent = `${currentIndex + 1} / ${quizList.length}`;
    document.getElementById('instruction-text').textContent = current.instruction;
    
    const sentenceBox = document.getElementById('sentence-text');
    if (current.sentence === "") {
        sentenceBox.style.display = 'none';
    } else {
        sentenceBox.style.display = 'block';
        sentenceBox.textContent = current.sentence;
    }

    document.getElementById('feedback').textContent = "";
    
    const container = document.getElementById('choices-container');
    container.innerHTML = '';
    isFirstTry = true;

    const choices = [current.a, ...current.c].sort(() => Math.random() - 0.5);

    choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'choice-btn';
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(choice, current.a, btn);
        container.appendChild(btn);
    });
}

function checkAnswer(selected, correct, btn) {
    if (selected === correct) {
        if (isFirstTry) {
            firstTryCorrectCount++;
            document.getElementById('feedback').style.color = "var(--success-green)";
            document.getElementById('feedback').textContent = "Correct!";
        }
        
        setTimeout(() => {
            currentIndex++;
            loadQuestion();
        }, 600);
    } else {
        if (isFirstTry) {
            mistakes.push({
                num: currentIndex + 1,
                instruction: quizList[currentIndex].instruction,
                correct: quizList[currentIndex].a
            });
            isFirstTry = false;
        }
        btn.classList.add('wrong');
        document.getElementById('feedback').style.color = "var(--error-red)";
        document.getElementById('feedback').textContent = "Try again!";
    }
}

function showResult() {
    document.getElementById('quiz-screen').style.display = 'none';
    document.getElementById('result-screen').style.display = 'block';
    document.getElementById('final-score').textContent = firstTryCorrectCount;

    if (mistakes.length > 0) {
        document.getElementById('mistake-container').style.display = 'block';
        const listDiv = document.getElementById('mistake-list');
        listDiv.innerHTML = mistakes.map(m => `
            <div class="mistake-item">
                <strong>問${m.num}: ${m.instruction}</strong><br>
                正解: <span style="color:var(--success-green); font-weight:bold;">${m.correct}</span>
            </div>
        `).join('');
    }
}

function setupPrintWorksheet() {
    const printContainer = document.getElementById('print-worksheet');
    if (!printContainer) return;

    let html = `
        <div class="print-header">
            <h2>2024-3 3A - From Spongy Moths to Astronomy - Vocabulary & Grammar Quiz</h2>
            <div class="print-meta">
                <span>Name: ______________________</span>
                <span>Date: ____________</span>
                <span>Score: ______ / ${quizList.length}</span>
            </div>
        </div>
    `;

    quizList.forEach((q, index) => {
        const choices = [q.a, ...q.c];
        
        const shuffledChoices = [...choices].sort((a, b) => {
            return ((a.length + index) % 3) - ((b.length + index) % 3);
        });

        html += `
            <div class="print-q-block">
                <div class="print-q-num">Q${index + 1}. ${q.instruction}</div>
                ${q.sentence ? `<div class="print-sentence">${q.sentence}</div>` : ''}
                <div class="print-choices">
                    ${shuffledChoices.map((choice, i) => `
                        <div class="print-choice-item">
                            <span class="print-choice-label">(${String.fromCharCode(65 + i)})</span> ${choice}
                        </div>
                    `).join('')}
                </div>
            </div>
        `;
    });

    printContainer.innerHTML = html;
}

window.onload = () => {
    loadQuestion();
    setupPrintWorksheet();
};
